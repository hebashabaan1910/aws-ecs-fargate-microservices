services:
  # ElastiCache Redis Simulator
  redis:
    image: redis:alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    networks:
      - microservices-net

  # Auth Service
  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      - PORT=3000
      - SERVICE_NAME=auth-service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=local-dev-jwt-super-secret-key-32chars
    depends_on:
      - redis
    networks:
      microservices-net:
        aliases:
          - auth.production.local
          - auth

  # Notifications Service
  notifications:
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
    container_name: notifications-service
    restart: unless-stopped
    environment:
      - PORT=3002
      - SERVICE_NAME=notifications-service
    networks:
      microservices-net:
        aliases:
          - notifications.production.local
          - notifications

  # Orders Service (Communicates with Auth & Notifications via Cloud Map simulated aliases)
  orders:
    build:
      context: ./services/orders
      dockerfile: Dockerfile
    container_name: orders-service
    restart: unless-stopped
    environment:
      - PORT=3001
      - SERVICE_NAME=orders-service
      - AUTH_SERVICE_URL=http://auth.production.local:3000
      - NOTIFICATIONS_SERVICE_URL=http://notifications.production.local:3002
    depends_on:
      - auth
      - notifications
    networks:
      microservices-net:
        aliases:
          - orders.production.local
          - orders

  # ALB Simulator (Nginx)
  alb-gateway:
    image: nginx:alpine
    container_name: alb-gateway
    restart: unless-stopped
    ports:
      - "8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - orders
      - notifications
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge
