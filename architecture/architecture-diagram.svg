<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #232F3E; }
      .subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; fill: #545B64; }
      .group-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #232F3E; }
      .node-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #16191F; text-anchor: middle; }
      .node-subtext { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; fill: #545B64; text-anchor: middle; }
      .port-text { font-family: monospace; font-size: 10px; fill: #0073BB; font-weight: bold; }
      .flow-label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; fill: #0073BB; font-weight: bold; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0073BB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1E8E3E"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8C4FFF"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="#F8F9FA"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="40" y="42" class="title">Project 6: Containerized Microservices Architecture on AWS ECS Fargate</text>
  <text x="820" y="42" class="subtitle">AWS SAA-C03 Capstone Project</text>

  <!-- External Client & Route 53 -->
  <g transform="translate(40, 110)">
    <!-- Users -->
    <rect x="0" y="70" width="110" height="70" rx="8" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="55" cy="95" r="14" fill="#FF9900" opacity="0.2"/>
    <circle cx="55" cy="92" r="6" fill="#FF9900"/>
    <path d="M43 108 A 12 10 0 0 1 67 108" fill="#FF9900"/>
    <text x="55" y="125" class="node-text">Clients / Users</text>

    <!-- Route 53 -->
    <rect x="0" y="180" width="110" height="70" rx="8" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="55" y="212" class="node-text" fill="#8C4FFF" font-weight="bold">Route 53</text>
    <text x="55" y="230" class="node-subtext">DNS Routing</text>
  </g>

  <!-- VPC Container -->
  <rect x="190" y="90" width="970" height="700" rx="12" fill="#FFFFFF" stroke="#FF9900" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadow)"/>
  <rect x="190" y="90" width="220" height="30" rx="6" fill="#FF9900"/>
  <text x="200" y="111" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">AWS VPC (10.0.0.0/16)</text>

  <!-- Internet Gateway -->
  <rect x="205" y="130" width="130" height="40" rx="6" fill="#EBF3FB" stroke="#0073BB" stroke-width="1"/>
  <text x="270" y="154" class="node-text">Internet Gateway</text>

  <!-- Availability Zone A -->
  <rect x="210" y="190" width="460" height="580" rx="10" fill="#F4F6F8" stroke="#D5DBDB" stroke-width="1"/>
  <text x="225" y="215" class="group-title">Availability Zone: us-east-1a</text>

  <!-- Availability Zone B -->
  <rect x="685" y="190" width="460" height="580" rx="10" fill="#F4F6F8" stroke="#D5DBDB" stroke-width="1"/>
  <text x="700" y="215" class="group-title">Availability Zone: us-east-1b</text>

  <!-- Public Subnet AZ1 -->
  <rect x="225" y="230" width="430" height="90" rx="8" fill="#EBF9F1" stroke="#1E8E3E" stroke-width="1.2"/>
  <text x="235" y="250" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#1E8E3E">Public Subnet 1 (10.0.1.0/24)</text>

  <!-- Public Subnet AZ2 -->
  <rect x="700" y="230" width="430" height="90" rx="8" fill="#EBF9F1" stroke="#1E8E3E" stroke-width="1.2"/>
  <text x="710" y="250" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#1E8E3E">Public Subnet 2 (10.0.2.0/24)</text>

  <!-- ALB Spanning Public Subnets -->
  <rect x="420" y="255" width="280" height="55" rx="8" fill="#FFFFFF" stroke="#0073BB" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="278" class="node-text" font-weight="bold">Application Load Balancer</text>
  <text x="560" y="296" class="node-subtext">Path Routing: /api/auth | /api/orders | /api/notifications</text>

  <!-- NAT Gateways -->
  <rect x="250" y="265" width="130" height="45" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="315" y="290" class="node-text">NAT Gateway AZ1</text>

  <rect x="960" y="265" width="130" height="45" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1"/>
  <text x="1025" y="290" class="node-text">NAT Gateway AZ2</text>

  <!-- Private Application Subnet AZ1 -->
  <rect x="225" y="340" width="430" height="290" rx="8" fill="#EBF3FB" stroke="#0073BB" stroke-width="1.2"/>
  <text x="235" y="360" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0073BB">Private App Subnet 1 (10.0.10.0/24) - ECS Tasks</text>

  <!-- Private Application Subnet AZ2 -->
  <rect x="700" y="340" width="430" height="290" rx="8" fill="#EBF3FB" stroke="#0073BB" stroke-width="1.2"/>
  <text x="710" y="360" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#0073BB">Private App Subnet 2 (10.0.11.0/24) - ECS Tasks</text>

  <!-- Microservice Tasks in Subnet 1 -->
  <!-- Auth Service AZ1 -->
  <rect x="245" y="380" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#FF9900" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="335" y="405" class="node-text" font-weight="bold">Auth Service (Task 1)</text>
  <text x="335" y="423" class="node-subtext">Port: 3000 | Fargate</text>
  <text x="335" y="439" class="node-subtext">JWT + Redis Session</text>

  <!-- Orders Service AZ1 -->
  <rect x="245" y="460" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#146EB4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="335" y="485" class="node-text" font-weight="bold">Orders Service (Task 1)</text>
  <text x="335" y="503" class="node-subtext">Port: 3001 | Fargate</text>
  <text x="335" y="519" class="node-subtext">Inter-Service Orchestrator</text>

  <!-- Notifications Service AZ1 -->
  <rect x="245" y="540" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="335" y="565" class="node-text" font-weight="bold">Notifications (Task 1)</text>
  <text x="335" y="583" class="node-subtext">Port: 3002 | Fargate</text>
  <text x="335" y="599" class="node-subtext">Event Dispatcher</text>

  <!-- Microservice Tasks in Subnet 2 (Multi-AZ Standby / Active Replicas) -->
  <!-- Auth Service AZ2 -->
  <rect x="720" y="380" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#FF9900" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="810" y="405" class="node-text" font-weight="bold">Auth Service (Task 2)</text>
  <text x="810" y="423" class="node-subtext">Port: 3000 | Fargate</text>
  <text x="810" y="439" class="node-subtext">Multi-AZ High Availability</text>

  <!-- Orders Service AZ2 -->
  <rect x="720" y="460" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#146EB4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="810" y="485" class="node-text" font-weight="bold">Orders Service (Task 2)</text>
  <text x="810" y="503" class="node-subtext">Port: 3001 | Fargate</text>
  <text x="810" y="519" class="node-subtext">Multi-AZ High Availability</text>

  <!-- Notifications Service AZ2 -->
  <rect x="720" y="540" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="810" y="565" class="node-text" font-weight="bold">Notifications (Task 2)</text>
  <text x="810" y="583" class="node-subtext">Port: 3002 | Fargate</text>
  <text x="810" y="599" class="node-subtext">Multi-AZ High Availability</text>

  <!-- AWS Cloud Map (Center box between AZs) -->
  <rect x="455" y="380" width="225" height="230" rx="8" fill="#FFFFFF" stroke="#0073BB" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#shadow)"/>
  <text x="567" y="405" class="node-text" font-weight="bold" fill="#0073BB">AWS Cloud Map (Service Discovery)</text>
  <text x="567" y="423" class="node-subtext">Namespace: production.local</text>

  <rect x="470" y="435" width="195" height="40" rx="4" fill="#F4F6F8"/>
  <text x="567" y="458" class="node-subtext" font-weight="bold">auth.production.local:3000</text>

  <rect x="470" y="485" width="195" height="40" rx="4" fill="#F4F6F8"/>
  <text x="567" y="508" class="node-subtext" font-weight="bold">orders.production.local:3001</text>

  <rect x="470" y="535" width="195" height="40" rx="4" fill="#F4F6F8"/>
  <text x="567" y="558" class="node-subtext" font-weight="bold">notifications.production.local:3002</text>

  <text x="567" y="595" class="node-subtext" fill="#1E8E3E">SRV / A Record Registration</text>

  <!-- Private Database Subnet AZ1 -->
  <rect x="225" y="645" width="430" height="110" rx="8" fill="#FDF6EB" stroke="#FF9900" stroke-width="1.2"/>
  <text x="235" y="665" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FF9900">Private DB Subnet 1 (10.0.20.0/24)</text>

  <!-- Private Database Subnet AZ2 -->
  <rect x="700" y="645" width="430" height="110" rx="8" fill="#FDF6EB" stroke="#FF9900" stroke-width="1.2"/>
  <text x="710" y="665" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FF9900">Private DB Subnet 2 (10.0.21.0/24)</text>

  <!-- ElastiCache Primary & Replica -->
  <rect x="260" y="680" width="220" height="60" rx="6" fill="#FFFFFF" stroke="#D13212" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="370" y="705" class="node-text" font-weight="bold">ElastiCache Redis (Primary)</text>
  <text x="370" y="725" class="node-subtext">Port: 6379 | Session Store</text>

  <rect x="740" y="680" width="220" height="60" rx="6" fill="#FFFFFF" stroke="#D13212" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="850" y="705" class="node-text" font-weight="bold">ElastiCache Redis (Replica)</text>
  <text x="850" y="725" class="node-subtext">Multi-AZ Auto Failover</text>

  <!-- Side Services & DevOps Controls (Top Right Column) -->
  <g transform="translate(930, 360)">
    <!-- Secrets Manager -->
    <rect x="0" y="0" width="180" height="60" rx="6" fill="#FFFFFF" stroke="#D13212" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="90" y="25" class="node-text" font-weight="bold">AWS Secrets Manager</text>
    <text x="90" y="45" class="node-subtext">JWT Secret &amp; Credentials</text>

    <!-- CloudWatch & X-Ray -->
    <rect x="0" y="75" width="180" height="60" rx="6" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="90" y="100" class="node-text" font-weight="bold">AWS X-Ray &amp; CloudWatch</text>
    <text x="90" y="120" class="node-subtext">Tracing, Logs &amp; Alarms</text>

    <!-- CodePipeline & CodeDeploy -->
    <rect x="0" y="150" width="180" height="65" rx="6" fill="#FFFFFF" stroke="#1E8E3E" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="90" y="173" class="node-text" font-weight="bold">CodePipeline + CodeDeploy</text>
    <text x="90" y="193" class="node-subtext">Blue/Green Zero-Downtime</text>
    <text x="90" y="206" class="node-subtext" fill="#1E8E3E">Automatic Rollback</text>
  </g>

  <!-- Traffic Connectors -->
  <!-- Users to Route 53 -->
  <path d="M 55 140 L 55 180" stroke="#0073BB" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Route 53 to ALB -->
  <path d="M 110 215 C 220 215, 280 280, 420 280" stroke="#0073BB" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ALB to Services -->
  <path d="M 460 310 L 370 380" stroke="#0073BB" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 530 310 L 370 460" stroke="#0073BB" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 600 310 L 370 540" stroke="#0073BB" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Inter-service Discovery Arrows -->
  <path d="M 425 495 L 470 495" stroke="#146EB4" stroke-width="1.5" stroke-dasharray="3,3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 425 415 L 370 680" stroke="#D13212" stroke-width="1.5" stroke-dasharray="3,3" fill="none" marker-end="url(#arrow)"/>

  <!-- Redis Replication Arrow -->
  <path d="M 480 710 L 740 710" stroke="#D13212" stroke-width="2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow)"/>
  <text x="610" y="702" font-family="'Segoe UI', sans-serif" font-size="10" fill="#D13212" text-anchor="middle">Async Replication</text>
</svg>

