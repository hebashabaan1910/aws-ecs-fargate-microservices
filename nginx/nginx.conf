events { worker_connections 1024; }

http {
    upstream auth_service {
        server auth:3000;
    }

    upstream orders_service {
        server orders:3001;
    }

    upstream notifications_service {
        server notifications:3002;
    }

    server {
        listen 80;
        server_name localhost;

        # ALB Simulation: Path-based routing for Auth Service
        location /api/auth {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ALB Simulation: Path-based routing for Orders Service
        location /api/orders {
            proxy_pass http://orders_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ALB Simulation: Path-based routing for Notifications Service
        location /api/notifications {
            proxy_pass http://notifications_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health checks directly or by service
        location /health/auth {
            proxy_pass http://auth_service/health;
        }

        location /health/orders {
            proxy_pass http://orders_service/health;
        }

        location /health/notifications {
            proxy_pass http://notifications_service/health;
        }

        location / {
            return 200 '{"message": "Local ALB Gateway Simulator active. Routes: /api/auth/*, /api/orders/*, /api/notifications/*"}';
            add_header Content-Type application/json;
        }
    }
}
